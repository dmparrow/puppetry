server:
  host: 0.0.0.0
  port: 8765
  blender_port: 8766
  # Only required for stereo mode. Mono mode starts without this file.
  calibration_file: calibration/stereo.npz
  confidence_threshold: 0.35
  max_reprojection_error_px: 12.0
  smoothing_alpha: 0.55

tracker:
  # Stereo 2D tracker used before geometric triangulation.
  model: rtmw-x-l_256x192
  stage_name: body

mono:
  # RTMW3D through rtmlib. Monocular depth is relative, so the server
  # root-locks the hips and normalizes actor scale by torso length.
  device: cuda
  backend: onnxruntime
  confidence_threshold: 0.25
  torso_length_m: 0.55
